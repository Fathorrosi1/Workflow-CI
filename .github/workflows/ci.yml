name: CI - MLflow Project + Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install mlflow==2.10.0 scikit-learn==1.3.2 pandas numpy matplotlib seaborn
      
      - name: Run MLflow Project
        run: |
          cd MLProject
          mlflow run . --env-manager=local -P data=../namadataset_preprocessing/telco_churn_preprocessing.csv
      
      - name: Get latest MLflow run_id
        id: get_run
        run: |
          cd MLProject
          RUN_ID=$(ls mlruns/0/ | head -1)
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Latest run_id: $RUN_ID"
      
      - name: Build Docker image with MLflow
        run: |
          cd MLProject
          mlflow models build-docker \
            -m runs:/${{ steps.get_run.outputs.run_id }}/model \
            -n ${{ secrets.DOCKER_USERNAME }}/telco-churn-model:latest
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/telco-churn-model:latest
      
      - name: Save artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: |
            MLProject/mlruns/
            MLProject/*.png
            MLProject/*.txt
